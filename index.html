<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎓 Étudiant — Direct (LiveKit)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:16px}
.wrap{max-width:900px;margin:auto}.card{background:#182235;border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:16px}
h1{margin:0 0 8px;font-size:24px}.muted{color:#94a3b8}.row{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:inherit;border-radius:10px;padding:12px 14px}input{flex:1;min-width:220px;background:#0b1220;color:#fff;border:1px solid #475569}
button{border:0;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
.danger{background:#dc2626}.gray{background:#475569}.green{background:#16a34a}.orange{background:#ea580c}.purple{background:#7c3aed}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;display:block;object-fit:cover}
.status{padding:12px;border-radius:10px;background:#243044;color:#cbd5e1;margin-top:12px}.ok{background:#12351f;color:#86efac}.err{background:#401b1b;color:#fca5a5}.wait{background:#3b2b0a;color:#fde68a}
#app{display:none}.login{max-width:430px;margin:80px auto;text-align:center}.small{font-size:13px}
.videoActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
h3{margin:0 0 10px;font-size:16px}
</style>
</head>
<body>
<div id="login" class="card login">
<h1>🎓 Espace Étudiant</h1>
<p class="muted">Connectez-vous avec Google pour suivre un direct.</p>
<button id="loginBtn">🔑 Connexion Google</button>
<div id="loginError" class="small"></div>
</div>

<div id="app" class="wrap">
<div class="card">
<h1>🎓 Direct de la classe (LiveKit)</h1>
<div id="user" class="muted"></div>
</div>

<div class="card">
<div class="row">
<input id="roomId" placeholder="ID de salle, ex: cours_test" autocomplete="off">
<button id="joinBtn">▶️ Rejoindre</button>
<button id="leaveBtn" class="danger" disabled>⏹️ Quitter</button>
</div>
<div id="status" class="status">Entrez l'ID de la salle.</div>
</div>

<div class="grid">
<div class="card">
<h3>📹 Vidéo du professeur</h3>
<video id="remoteVideo" autoplay playsinline webkit-playsinline></video>
<div class="videoActions">
<button id="soundBtn" class="gray" disabled>🔊 Activer le son</button>
</div>
<p id="videoInfo" class="muted small">La vidéo du professeur apparaîtra ici.</p>
</div>

<div class="card">
<h3>🎤 Ma caméra (répondre)</h3>
<video id="localVideo" autoplay playsinline muted></video>
<div class="videoActions">
<button id="publishBtn" class="purple" disabled>📤 Activer ma caméra</button>
<button id="cameraBtn" class="gray" disabled>📷 Caméra</button>
<button id="micBtn" class="gray" disabled>🎤 Micro</button>
<button id="switchBtn" class="orange" disabled>🔄 Retourner</button>
</div>
<p id="localInfo" class="muted small">Cliquez sur « Activer ma caméra » pour participer.</p>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyBn7VIddclO7KtrXb5sibCr9SjVLjOy-qI",
 authDomain:"theo1d.firebaseapp.com",projectId:"theo1d",
 storageBucket:"theo1d.firebasestorage.app",messagingSenderId:"269629842962",
 appId:"1:269629842962:web:a80a12b04448fe1e595acb"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

// ===== Configuration LiveKit =====
const TOKEN_SERVER_ID = "theo-az31wf";

let room = null;
let audioEl = null;
let currentFacingMode = "user";
let isPublishing = false;

const $=id=>document.getElementById(id);
function status(m,t=""){ $("status").textContent=m;$("status").className="status "+t; }
function localInfo(m,t=""){ $("localInfo").textContent=m; }

// ===== Obtention du token =====
async function fetchToken(roomName) {
    const tokenSource = LivekitClient.TokenSource.sandboxTokenServer(TOKEN_SERVER_ID);
    const { serverUrl, participantToken } = await tokenSource.fetch({ roomName });
    return { token: participantToken, url: serverUrl };
}

// ===== Rejoindre la salle =====
async function join(){
 const id = $("roomId").value.trim();
 const user = auth.currentUser;
 if(!id) return status("❌ Entrez un ID de salle.","err");
 if(!user) return status("❌ Vous devez être connecté.","err");

 $("joinBtn").disabled = true;
 status("🔄 Demande de token LiveKit...", "wait");

 try {
   const { token, url } = await fetchToken(id);

   room = new LivekitClient.Room({
     adaptiveStream: true,
     dynacast: true,
   });

   const remoteVideo = $("remoteVideo");

   // ===== Écoute des pistes du professeur =====
   room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
     console.log("🎥 Piste reçue:", track.kind, "de", participant.identity);

     if (track.kind === LivekitClient.Track.Kind.Video) {
       track.attach(remoteVideo);
       $("soundBtn").disabled = false;
       $("videoInfo").textContent = "🟢 Vidéo du professeur affichée.";
       status("🟢 Vidéo du professeur reçue.", "ok");
       remoteVideo.play().catch(e => console.warn("Autoplay vidéo bloqué:", e));
     }

     if (track.kind === LivekitClient.Track.Kind.Audio) {
       if(!audioEl){
         audioEl = document.createElement('audio');
         audioEl.autoplay = true;
         audioEl.style.display = 'none';
         document.body.appendChild(audioEl);
       }
       track.attach(audioEl);
       audioEl.play().catch(e => console.warn("Autoplay audio bloqué:", e));
     }
   });

   room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
     try { track.detach(); } catch(e){}
   });

   room.on(LivekitClient.RoomEvent.Disconnected, () => {
     status("⚠️ Déconnecté de la salle.", "err");
     leave(false);
   });

   // ===== Se connecter =====
   status("🔄 Connexion à la salle LiveKit...", "wait");
   await room.connect(url, token);
   console.log("✅ Connecté à la salle");

   status("🟢 Connecté. En attente de la vidéo du professeur...", "ok");
   $("leaveBtn").disabled = false;
   $("publishBtn").disabled = false;
   $("videoInfo").textContent = "En attente du flux vidéo du professeur...";

   // Récupérer les pistes déjà publiées par le professeur
   room.remoteParticipants.forEach(p => {
     p.trackPublications.forEach(pub => {
       if (pub.track && pub.kind === LivekitClient.Track.Kind.Video) {
         pub.track.attach(remoteVideo);
         $("soundBtn").disabled = false;
       }
       if (pub.track && pub.kind === LivekitClient.Track.Kind.Audio) {
         if(!audioEl){
           audioEl = document.createElement('audio');
           audioEl.autoplay = true;
           audioEl.style.display = 'none';
           document.body.appendChild(audioEl);
         }
         pub.track.attach(audioEl);
       }
     });
   });

 } catch(e) {
   console.error("❌ Erreur join:", e);
   status("❌ " + (e.message || "Erreur inconnue"), "err");
   if(room){ try{ await room.disconnect(); }catch(_){} room = null; }
   $("joinBtn").disabled = false;
   $("leaveBtn").disabled = true;
 }
}

// ===== Activer la caméra et le micro de l'étudiant =====
async function publishCamera(){
 if(!room) return;
 
 try {
   localInfo("🔄 Activation de la caméra...");

   await room.localParticipant.enableCameraAndMicrophone();
   
   // Attacher la vidéo locale
   const videoEl = $("localVideo");
   const camPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
   if (camPub && camPub.track) {
     camPub.track.attach(videoEl);
   }

   // Réattacher si de nouvelles pistes sont publiées
   room.on(LivekitClient.RoomEvent.LocalTrackPublished, (pub) => {
     if (pub.source === LivekitClient.Track.Source.Camera && pub.track) {
       pub.track.attach(videoEl);
     }
   });

   isPublishing = true;
   $("publishBtn").disabled = true;
   $("cameraBtn").disabled = false;
   $("micBtn").disabled = false;
   $("switchBtn").disabled = false;
   localInfo("🟢 Vous êtes en direct. Le professeur peut vous voir.");
   status("🟢 Caméra et micro activés.", "ok");

 } catch(e) {
   console.error("❌ Erreur publishCamera:", e);
   localInfo("❌ Impossible d'activer la caméra : " + e.message);
 }
}

// ===== Basculer entre caméra avant / arrière =====
async function switchCamera() {
    if (!room || !isPublishing) return;
    
    const target = currentFacingMode === "user" ? "environment" : "user";
    console.log("🔄 Bascule vers caméra:", target);
    localInfo("🔄 Recherche d'une caméra " + (target === "user" ? "frontale" : "arrière") + "...");

    try {
        const devices = await LivekitClient.Room.getLocalDevices('videoinput');
        
        if (!devices || devices.length === 0) {
            localInfo("⚠️ Aucune caméra détectée.");
            return;
        }

        console.log("📹 Caméras disponibles:", devices.map(d => d.label || d.deviceId));

        let targetDevice = null;
        const backKeywords = ["back", "rear", "arrière", "environment", "world"];
        const frontKeywords = ["front", "face", "avant", "user", "selfie"];

        for (const device of devices) {
            const label = (device.label || "").toLowerCase();
            if (target === "environment") {
                if (backKeywords.some(k => label.includes(k))) {
                    targetDevice = device;
                    break;
                }
            } else {
                if (frontKeywords.some(k => label.includes(k))) {
                    targetDevice = device;
                    break;
                }
            }
        }

        if (!targetDevice) {
            const currentPub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
            const currentDeviceId = currentPub?.track?.mediaStreamTrack?.getSettings()?.deviceId;
            targetDevice = devices.find(d => d.deviceId !== currentDeviceId);
            if (!targetDevice) targetDevice = devices[0];
        }

        console.log("🎯 Caméra cible:", targetDevice.label || targetDevice.deviceId);

        await room.switchActiveDevice('videoinput', targetDevice.deviceId);
        
        currentFacingMode = target;
        localInfo("🟢 Caméra basculée vers : " + (target === "user" ? "Selfie" : "Arrière"));
        $("switchBtn").textContent = target === "user" ? "🔄 Passer à l'arrière" : "🔄 Passer au selfie";

    } catch (e) {
        console.error("❌ Erreur switchCamera:", e);
        localInfo("❌ Impossible de basculer : " + e.message);
    }
}

async function leave(clearUI=true){
 if(room){
   try { await room.disconnect(); } catch(e){ console.warn(e); }
   room = null;
 }

 $("remoteVideo").srcObject = null;
 $("localVideo").srcObject = null;
 $("soundBtn").disabled = true;
 $("publishBtn").disabled = true;
 $("cameraBtn").disabled = true;
 $("micBtn").disabled = true;
 $("switchBtn").disabled = true;
 $("videoInfo").textContent = "La vidéo du professeur apparaîtra ici.";
 localInfo("Cliquez sur « Activer ma caméra » pour participer.");
 isPublishing = false;
 currentFacingMode = "user";
 $("switchBtn").textContent = "🔄 Retourner";

 if(clearUI){
   $("joinBtn").disabled = false;
   $("leaveBtn").disabled = true;
   status("Vous avez quitté le direct.");
 }
}

$("loginBtn").onclick=async()=>{
 try{
  const p=new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({prompt:"select_account"});
  await auth.signInWithPopup(p);
 }catch(e){$("loginError").textContent="❌ "+e.message;}
};

$("joinBtn").onclick=join;
$("leaveBtn").onclick=()=>leave(true);
$("publishBtn").onclick=publishCamera;
$("switchBtn").onclick=switchCamera;

$("cameraBtn").onclick=()=>{
 if(!room || !isPublishing) return;
 const pub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Camera);
 if(pub && pub.track){
   pub.track.enabled = !pub.track.enabled;
   $("cameraBtn").textContent = pub.track.enabled ? "📷 Caméra" : "📷 Caméra OFF";
 }
};
$("micBtn").onclick=()=>{
 if(!room || !isPublishing) return;
 const pub = room.localParticipant.getTrackPublication(LivekitClient.Track.Source.Microphone);
 if(pub && pub.track){
   pub.track.enabled = !pub.track.enabled;
   $("micBtn").textContent = pub.track.enabled ? "🎤 Micro" : "🎤 Micro OFF";
 }
};

$("soundBtn").onclick=async()=>{
 const video=$("remoteVideo");
 try {
   video.muted = false;
   await video.play();
   $("soundBtn").textContent="🔊 Son activé";
   status("🔊 Son du professeur activé.", "ok");
 } catch(e) {
   status("⚠️ Appuyez encore une fois pour activer le son.", "wait");
 }
};

auth.onAuthStateChanged(u=>{
 if(u){
  $("login").style.display="none";
  $("app").style.display="block";
  $("user").textContent=`Connecté : ${u.displayName||u.email}`;
 }else{
  $("login").style.display="block";
  $("app").style.display="none";
 }
});

window.addEventListener("pagehide",()=>{
 if(room){ try{ room.disconnect(); }catch(e){} }
});
</script>
</body>
</html>
