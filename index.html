<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>👨‍🏫 Professeur - Direct</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:#1e293b;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

h1{
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.green{background:#22c55e;color:#052e16}
.red{background:#ef4444;color:white}
.blue{background:#3b82f6;color:white}
.gray{background:#64748b;color:white}
.orange{background:#f59e0b;color:#111827}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:16px;
    margin-bottom:10px;
}

video{
    width:100%;
    max-height:600px;
    background:#000;
    border-radius:14px;
    display:none;
}

#cameraPlaceholder{
    height:400px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#020617;
    border-radius:14px;
    font-size:20px;
    color:#94a3b8;
}

.student{
    background:#0f172a;
    border-radius:10px;
    padding:12px;
    margin:8px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.status{
    padding:12px;
    border-radius:10px;
    background:#334155;
    margin-top:15px;
}

.online{
    color:#4ade80;
}

.pending{
    color:#fbbf24;
}

.rejected{
    color:#f87171;
}

@media(max-width:600px){
    body{padding:10px}
    #cameraPlaceholder{height:250px}
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>👨‍🏫 Professeur — Direct</h1>

        <div id="loginSection">
            <p>Connectez-vous avec Google.</p>
            <button id="loginBtn" class="blue">
                🔑 Connexion Google
            </button>
            <p id="loginMessage"></p>
        </div>

        <div id="appSection" style="display:none">

            <p>
                👤 <span id="profName"></span>
            </p>

            <br>

            <input
                id="roomInput"
                placeholder="ID de la salle"
                value="cours_test"
            >

            <button id="startBtn" class="green">
                ▶️ Lancer le direct
            </button>

            <button id="stopBtn" class="red" disabled>
                ⏹️ Arrêter
            </button>

            <button id="logoutBtn" class="gray">
                🚪 Déconnexion
            </button>

            <div class="status" id="status">
                🔒 Direct arrêté
            </div>

        </div>

    </div>


    <div class="card">

        <h2>📹 Caméra</h2>

        <br>

        <div id="cameraPlaceholder">
            📷
            <br>
            Caméra arrêtée
        </div>

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

        <br>

        <button id="cameraBtn" class="gray" disabled>
            📷 Caméra ON/OFF
        </button>

        <button id="micBtn" class="gray" disabled>
            🎤 Micro ON/OFF
        </button>

    </div>


    <div class="card">

        <h2>
            👥 Étudiants
            (<span id="studentCount">0</span>)
        </h2>

        <br>

        <div id="studentList">
            Aucun étudiant.
        </div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyBn7VIddclO7KtrXb5sibCr9SjVLjOy-qI",
    authDomain: "theo1d.firebaseapp.com",
    projectId: "theo1d",
    storageBucket: "theo1d.firebasestorage.app",
    messagingSenderId: "269629842962",
    appId: "1:269629842962:web:a80a12b04448fe1e595acb"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================================================
   WEBRTC
========================================================= */

const RTC_CONFIG = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        },

        {
            urls: "turn:openrelay.metered.ca:80",
            username: "openrelayproject",
            credential: "openrelayproject"
        },

        {
            urls: "turn:openrelay.metered.ca:443",
            username: "openrelayproject",
            credential: "openrelayproject"
        }

    ],

    iceCandidatePoolSize: 10
};


/* =========================================================
   VARIABLES
========================================================= */

let localStream = null;

let currentRoomId = null;

let studentsUnsubscribe = null;

let live = false;

const connections = new Map();

const candidateListeners = new Map();

const offerListeners = new Map();


/* =========================================================
   ELEMENTS
========================================================= */

const loginSection =
    document.getElementById("loginSection");

const appSection =
    document.getElementById("appSection");

const loginBtn =
    document.getElementById("loginBtn");

const loginMessage =
    document.getElementById("loginMessage");

const profName =
    document.getElementById("profName");

const roomInput =
    document.getElementById("roomInput");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const micBtn =
    document.getElementById("micBtn");

const localVideo =
    document.getElementById("localVideo");

const cameraPlaceholder =
    document.getElementById("cameraPlaceholder");

const status =
    document.getElementById("status");

const studentList =
    document.getElementById("studentList");

const studentCount =
    document.getElementById("studentCount");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message){

    status.textContent = message;

}


/* =========================================================
   LOGIN
========================================================= */

loginBtn.onclick = async () => {

    try{

        loginBtn.disabled = true;

        const provider =
            new firebase.auth.GoogleAuthProvider();

        provider.setCustomParameters({
            prompt:"select_account"
        });

        await auth.signInWithPopup(provider);

    }catch(error){

        console.error(error);

        loginMessage.textContent =
            "❌ " + error.message;

        loginBtn.disabled = false;
    }

};


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(user => {

    if(user){

        loginSection.style.display = "none";

        appSection.style.display = "block";

        profName.textContent =
            user.displayName || user.email;

    }else{

        loginSection.style.display = "block";

        appSection.style.display = "none";
    }

});


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

    if(localStream)
        return;

    localStream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                width:{ideal:1280},
                height:{ideal:720},
                facingMode:"user"
            },

            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            }

        });

    localVideo.srcObject =
        localStream;

    localVideo.style.display =
        "block";

    cameraPlaceholder.style.display =
        "none";

    cameraBtn.disabled = false;
    micBtn.disabled = false;
}


/* =========================================================
   START LIVE
========================================================= */

startBtn.onclick = async () => {

    const roomId =
        roomInput.value.trim();

    if(!roomId){

        alert("Entrez un ID de salle.");

        return;
    }

    try{

        startBtn.disabled = true;

        setStatus("⏳ Démarrage de la caméra...");

        await startCamera();

        currentRoomId = roomId;

        const roomRef =
            db.collection("salles")
              .doc(roomId);

        await roomRef.set({

            live:true,

            professor:{

                uid:auth.currentUser.uid,

                name:
                    auth.currentUser.displayName ||
                    "Professeur",

                online:true,

                startedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            }

        });

        live = true;

        stopBtn.disabled = false;

        setStatus(
            "🟢 DIRECT EN COURS — Salle : " +
            roomId
        );

        listenStudents();

    }catch(error){

        console.error(error);

        setStatus(
            "❌ " + error.message
        );

        startBtn.disabled = false;
    }

};


/* =========================================================
   LISTEN STUDENTS
========================================================= */

function listenStudents(){

    if(studentsUnsubscribe)
        studentsUnsubscribe();

    studentsUnsubscribe =

        db.collection("salles")
          .doc(currentRoomId)
          .collection("etudiants")
          .onSnapshot(snapshot => {

              studentCount.textContent =
                  snapshot.size;

              if(snapshot.empty){

                  studentList.innerHTML =
                      "Aucun étudiant.";

                  return;
              }

              let html = "";

              snapshot.forEach(doc => {

                  const data = doc.data();

                  const id = doc.id;

                  const studentStatus =
                      data.status || "pending";

                  html += `

                    <div class="student">

                        <div>

                            <strong>
                                ${escapeHtml(
                                    data.name ||
                                    "Étudiant"
                                )}
                            </strong>

                            <br>

                            <small>
                                ${escapeHtml(
                                    data.email || ""
                                )}
                            </small>

                            <br>

                            <span class="${
                                studentStatus === "approved"
                                ? "online"
                                : studentStatus === "rejected"
                                ? "rejected"
                                : "pending"
                            }">

                                ${
                                    studentStatus === "approved"
                                    ? "🟢 Connecté"
                                    : studentStatus === "rejected"
                                    ? "❌ Refusé"
                                    : "⏳ En attente"
                                }

                            </span>

                        </div>

                        <div>

                            ${
                                studentStatus === "pending"

                                ?

                                `
                                <button
                                    class="green"
                                    onclick="approveStudent('${id}')">

                                    ✅ Accepter

                                </button>

                                <button
                                    class="red"
                                    onclick="rejectStudent('${id}')">

                                    ❌ Refuser

                                </button>
                                `

                                :

                                ""

                            }

                        </div>

                    </div>

                  `;
              });

              studentList.innerHTML =
                  html;

          });

}


/* =========================================================
   APPROVE
========================================================= */

window.approveStudent = async function(studentId){

    if(!currentRoomId)
        return;

    try{

        await db.collection("salles")
            .doc(currentRoomId)
            .collection("etudiants")
            .doc(studentId)
            .update({

                status:"approved",

                approvedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });

        setStatus(
            "✅ Étudiant accepté. Attente de son offre WebRTC..."
        );

        waitForStudentOffer(studentId);

    }catch(error){

        console.error(error);

        setStatus(
            "❌ Erreur acceptation : " +
            error.message
        );
    }

};


/* =========================================================
   REJECT
========================================================= */

window.rejectStudent = async function(studentId){

    if(!currentRoomId)
        return;

    try{

        await db.collection("salles")
            .doc(currentRoomId)
            .collection("etudiants")
            .doc(studentId)
            .update({

                status:"rejected",

                rejectedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });

    }catch(error){

        console.error(error);
    }

};


/* =========================================================
   WAIT OFFER
========================================================= */

function waitForStudentOffer(studentId){

    if(offerListeners.has(studentId))
        return;

    const offerRef =
        db.collection("salles")
          .doc(currentRoomId)
          .collection("etudiants")
          .doc(studentId)
          .collection("offer")
          .doc("current");

    const unsubscribe =
        offerRef.onSnapshot(async doc => {

            if(!doc.exists)
                return;

            const offer =
                doc.data();

            if(!offer.sdp)
                return;

            console.log(
                "📨 Offre reçue :",
                studentId
            );

            await createProfessorConnection(
                studentId,
                offer
            );

        });

    offerListeners.set(
        studentId,
        unsubscribe
    );

}


/* =========================================================
   CREATE PROFESSOR CONNECTION
========================================================= */

async function createProfessorConnection(
    studentId,
    offer
){

    if(connections.has(studentId)){

        console.log(
            "Connexion déjà existante :",
            studentId
        );

        return;
    }

    try{

        const pc =
            new RTCPeerConnection(
                RTC_CONFIG
            );

        connections.set(
            studentId,
            pc
        );


        /* LOCAL VIDEO */

        localStream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    localStream
                );

            });


        /* ICE PROFESSEUR */

        const professorCandidatesRef =

            db.collection("salles")
              .doc(currentRoomId)
              .collection("etudiants")
              .doc(studentId)
              .collection("professorCandidates");


        pc.onicecandidate = event => {

            if(!event.candidate)
                return;

            professorCandidatesRef
                .add(
                    event.candidate.toJSON()
                )
                .catch(console.error);

        };


        /* CONNECTION STATE */

        pc.onconnectionstatechange = () => {

            console.log(
                "Professeur →",
                studentId,
                pc.connectionState
            );

            if(pc.connectionState === "connected"){

                console.log(
                    "🎥 Étudiant connecté :",
                    studentId
                );

            }

            if(
                pc.connectionState === "failed" ||
                pc.connectionState === "closed"
            ){

                closeStudentConnection(
                    studentId
                );

            }

        };


        /* ICE STATE */

        pc.oniceconnectionstatechange = () => {

            console.log(
                "ICE →",
                studentId,
                pc.iceConnectionState
            );

        };


        /* RECEIVE STUDENT ICE */

        const waitingCandidates = [];

        const studentCandidatesRef =

            db.collection("salles")
              .doc(currentRoomId)
              .collection("etudiants")
              .doc(studentId)
              .collection("studentCandidates");


        const candidateUnsubscribe =

            studentCandidatesRef.onSnapshot(
                snapshot => {

                    snapshot.docChanges()
                        .forEach(async change => {

                            if(
                                change.type !== "added"
                            )
                                return;

                            const candidate =
                                change.doc.data();

                            if(
                                !pc.remoteDescription
                            ){

                                waitingCandidates.push(
                                    candidate
                                );

                                return;
                            }

                            try{

                                await pc.addIceCandidate(
                                    new RTCIceCandidate(
                                        candidate
                                    )
                                );

                            }catch(error){

                                console.error(
                                    "ICE étudiant:",
                                    error
                                );

                            }

                        });

                }
            );


        candidateListeners.set(
            studentId,
            candidateUnsubscribe
        );


        /* REMOTE OFFER */

        await pc.setRemoteDescription(

            new RTCSessionDescription({

                type:offer.type,

                sdp:offer.sdp

            })

        );


        /* ADD WAITING ICE */

        for(
            const candidate
            of waitingCandidates
        ){

            try{

                await pc.addIceCandidate(

                    new RTCIceCandidate(
                        candidate
                    )

                );

            }catch(error){

                console.error(error);

            }

        }


        /* CREATE ANSWER */

        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );


        /* SEND ANSWER */

        await db.collection("salles")
            .doc(currentRoomId)
            .collection("etudiants")
            .doc(studentId)
            .collection("answer")
            .doc("current")
            .set({

                type:answer.type,

                sdp:answer.sdp,

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


        console.log(
            "✅ Answer envoyée :",
            studentId
        );


        setStatus(
            "🟢 Connexion WebRTC établie avec l'étudiant."
        );

    }catch(error){

        console.error(
            "❌ Erreur WebRTC professeur:",
            error
        );

        closeStudentConnection(
            studentId
        );

    }

}


/* =========================================================
   CLOSE STUDENT
========================================================= */

function closeStudentConnection(studentId){

    const pc =
        connections.get(studentId);

    if(pc){

        try{
            pc.close();
        }catch(e){}

    }

    connections.delete(
        studentId
    );

    const candidateUnsubscribe =
        candidateListeners.get(
            studentId
        );

    if(candidateUnsubscribe){

        candidateUnsubscribe();

        candidateListeners.delete(
            studentId
        );

    }

}


/* =========================================================
   STOP LIVE
========================================================= */

stopBtn.onclick = async () => {

    await stopLive();

};


/* =========================================================
   STOP
========================================================= */

async function stopLive(){

    live = false;


    for(
        const studentId
        of connections.keys()
    ){

        closeStudentConnection(
            studentId
        );

    }


    if(studentsUnsubscribe){

        studentsUnsubscribe();

        studentsUnsubscribe = null;

    }


    for(
        const unsubscribe
        of offerListeners.values()
    ){

        unsubscribe();

    }

    offerListeners.clear();


    if(currentRoomId){

        try{

            await db.collection("salles")
                .doc(currentRoomId)
                .update({

                    live:false,

                    "professor.online":false,

                    endedAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });

        }catch(error){

            console.error(error);

        }

    }


    currentRoomId = null;


    setStatus(
        "⏹️ Direct arrêté"
    );

    stopBtn.disabled = true;

    startBtn.disabled = false;


    studentList.innerHTML =
        "Aucun étudiant.";

    studentCount.textContent =
        "0";

}


/* =========================================================
   CAMERA
========================================================= */

cameraBtn.onclick = () => {

    if(!localStream)
        return;

    const track =
        localStream.getVideoTracks()[0];

    if(!track)
        return;

    track.enabled =
        !track.enabled;

    cameraBtn.textContent =
        track.enabled
        ? "📷 Caméra ON"
        : "📷 Caméra OFF";

};


/* =========================================================
   MICRO
========================================================= */

micBtn.onclick = () => {

    if(!localStream)
        return;

    const track =
        localStream.getAudioTracks()[0];

    if(!track)
        return;

    track.enabled =
        !track.enabled;

    micBtn.textContent =
        track.enabled
        ? "🎤 Micro ON"
        : "🔇 Micro OFF";

};


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.onclick = async () => {

    await stopLive();

    if(localStream){

        localStream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        localStream = null;

    }

    await auth.signOut();

};


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        for(
            const pc
            of connections.values()
        ){

            try{
                pc.close();
            }catch(e){}

        }

    }
);


/* =========================================================
   SECURITY HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
