<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>👨‍🏫 Professeur - Direct</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;

}

    font-size:13px

.offline{

.secondary{

}

.room{

input{

    justify-content:space-between;

    gap:10px;
    padding:12px;
    border-bottom:1px solid #334155;
    flex-wrap:wrap
}

.student-name{
    font-weight:bold
}

.student-email{
    font-size:12px;
    color:#94a3b8
}

.actions{

    gap:5px
}

.accept{
    background:#22c55e;
    color:#052e16
}

.reject{

    color:white
}

.status{
    margin-top:15px;
    padding:14px;
    border-radius:10px;
    background:#1e293b;
    text-align:center
}

.success{
    background:#064e3b
}

.error{
    background:#7f1d1d
}

.login{
    max-width:400px;
    margin:100px auto;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    text-align:center
}

.login button{
    width:100%;
    margin-top:20px;
    background:white;
    color:#111827
}

@media(max-width:600px){
    body{
        padding:10px
    }

    .video-box,
    #localVideo,
    .placeholder{
        min-height:250px
    }
}
</style>
</head>

<body>

<div id="loginPanel" class="login">
    <h1>👨‍🏫</h1>
    <h2>Espace Professeur</h2>
    <p style="color:#94a3b8;margin-top:10px">
        Connectez-vous pour lancer votre direct.
    </p>

    <button id="loginBtn">
        🔐 Se connecter avec Google
    </button>

    <div id="loginError" style="margin-top:15px;color:#f87171"></div>
</div>


<div id="app" style="display:none">

<div class="container">

<header>
    <h1>👨‍🏫 Professeur — DIRECT</h1>

    <div>
        <span id="liveBadge" class="badge offline">
            🔴 Direct arrêté
        </span>

        <span id="viewerCount" class="badge">
            👥 0
        </span>
    </div>
</header>


<div class="video-box">

    <video
        id="localVideo"
        autoplay
        playsinline
        muted>
    </video>

    <div id="placeholder" class="placeholder">
        <div class="icon">📷</div>
        <div>Caméra inactive</div>
        <small>Lancez le direct</small>
    </div>

</div>


<div class="controls">

    <button id="startBtn" class="start">
        ▶️ Lancer le direct
    </button>

    <button id="stopBtn" class="stop" disabled>
        ⏹️ Arrêter
    </button>

    <button id="cameraBtn" class="secondary">
        📷 Caméra
    </button>

    <button id="micBtn" class="secondary">
        🎤 Micro
    </button>

</div>


<div class="room">

    <h3>🏷️ Salle</h3>

    <input
        id="roomInput"
        value="cours_test"
        placeholder="ID de la salle">

    <div id="roomDisplay" class="room-id">
        —
    </div>

    <button id="copyBtn" class="secondary" style="margin-top:10px">
        📋 Copier l'ID
    </button>

</div>


<div class="students">

    <h3>👥 Étudiants</h3>

    <div id="studentList">
        <p style="color:#64748b;margin-top:15px">
            Aucun étudiant.
        </p>
    </div>

</div>


<div id="status" class="status">
    🔒 Prêt.
</div>

</div>
</div>


<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {
    apiKey:"AIzaSyBn7VIddclO7KtrXb5sibCr9SjVLjOy-qI",
    authDomain:"theo1d.firebaseapp.com",
    projectId:"theo1d",
    storageBucket:"theo1d.firebasestorage.app",
    messagingSenderId:"269629842962",
    appId:"1:269629842962:web:a80a12b04448fe1e595acb"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();


/*
IMPORTANT :
Pour tester, STUN suffit parfois.
Pour une vraie utilisation sur différents réseaux,
il faut un vrai serveur TURN.
*/

const RTC_CONFIG={
    iceServers:[
        {
            urls:[
                "stun:stun.l.google.com:19302"
            ]
        },

        {
            urls:"turn:openrelay.metered.ca:80",
            username:"openrelayproject",
            credential:"openrelayproject"
        },

        {
            urls:"turn:openrelay.metered.ca:443",
            username:"openrelayproject",
            credential:"openrelayproject"
        }
    ]
};


/* =========================
   VARIABLES
========================= */

let localStream=null;

let roomId=null;

let roomListener=null;
let offersListener=null;

const connections=new Map();

const candidateListeners=new Map();


/* =========================
   ELEMENTS
========================= */

const loginPanel=document.getElementById("loginPanel");
const app=document.getElementById("app");

const loginBtn=document.getElementById("loginBtn");
const loginError=document.getElementById("loginError");

const localVideo=document.getElementById("localVideo");
const placeholder=document.getElementById("placeholder");

const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");

const cameraBtn=document.getElementById("cameraBtn");
const micBtn=document.getElementById("micBtn");

const roomInput=document.getElementById("roomInput");
const roomDisplay=document.getElementById("roomDisplay");

const studentList=document.getElementById("studentList");

const status=document.getElementById("status");
const liveBadge=document.getElementById("liveBadge");
const viewerCount=document.getElementById("viewerCount");


/* =========================
   UI
========================= */

function setStatus(text,type=""){
    status.textContent=text;
    status.className="status "+type;
}


/* =========================
   CAMERA
========================= */

async function openCamera(){

    if(localStream){
        return;
    }

    try{

        localStream=await navigator.mediaDevices.getUserMedia({
            video:{
                width:{ideal:1280},
                height:{ideal:720},
                facingMode:"user"
            },
            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            }
        });

        localVideo.srcObject=localStream;

        localVideo.style.display="block";
        placeholder.style.display="none";

        await localVideo.play().catch(()=>{});

        console.log("CAMERA OK");

    }catch(error){

        console.error(error);

        throw new Error(
            "Impossible d'utiliser la caméra/micro : "
            + error.message
        );
    }
}


/* =========================
   START LIVE
========================= */

async function startLive(){

    if(!auth.currentUser){
        throw new Error("Vous devez être connecté.");
    }

    roomId=roomInput.value.trim();

    if(!roomId){
        throw new Error("ID de salle obligatoire.");
    }

    await openCamera();


    const roomRef=db.collection("salles").doc(roomId);


    /*
    IMPORTANT :
    On ne fait PAS viewers:{}
    ici afin d'éviter d'écraser
    accidentellement une salle.
    */

    await roomRef.set({

        professor:{
            uid:auth.currentUser.uid,
            name:auth.currentUser.displayName || "Professeur",
            online:true,
            startedAt:firebase.firestore.FieldValue.serverTimestamp()
        },

        viewers:{},

        pending:{},

        approved:[]

    });


    roomDisplay.textContent=roomId;


    /* écouter la salle */

    roomListener=roomRef.onSnapshot(snapshot=>{

        if(!snapshot.exists){
            return;
        }

        const data=snapshot.data();

        const viewers=data.viewers || {};
        const pending=data.pending || {};
        const approved=data.approved || [];


        viewerCount.textContent=
            "👥 "+Object.keys(approved).length;


        renderStudents(viewers,pending,approved);

    });


    /* écouter les offres */

    offersListener=roomRef
        .collection("offers")
        .onSnapshot(snapshot=>{

            snapshot.docChanges().forEach(change=>{

                if(change.type!=="added"){
                    return;
                }

                const studentId=change.doc.id;

                console.log(
                    "OFFRE ETUDIANT:",
                    studentId
                );

                /*
                L'étudiant ne doit normalement
                envoyer son offre qu'après
                approbation.
                */

                createStudentConnection(
                    studentId,
                    change.doc.data()
                );

            });

        });


    liveBadge.textContent="🟢 Direct en cours";
    liveBadge.className="badge online";

    startBtn.disabled=true;
    stopBtn.disabled=false;

    setStatus(
        "🎥 DIRECT EN COURS — Salle : "+roomId,
        "success"
    );
}


/* =========================
   CREATE CONNECTION
========================= */

async function createStudentConnection(
    studentId,
    offerData
){

    if(connections.has(studentId)){
        console.log(
            "Connexion déjà existante:",
            studentId
        );
        return;
    }


    if(!localStream){
        console.error("Pas de flux local.");
        return;
    }


    try{

        console.log(
            "Création PeerConnection:",
            studentId
        );


        const pc=new RTCPeerConnection(
            RTC_CONFIG
        );


        connections.set(studentId,pc);


        /*
        AJOUTER CAMERA + MICRO
        */

        localStream.getTracks().forEach(track=>{

            pc.addTrack(
                track,
                localStream
            );

        });


        /*
        CANDIDATS ICE DU PROFESSEUR
        */

        const profCandidatesRef=
            db.collection("salles")
            .doc(roomId)
            .collection("answers")
            .doc(studentId)
            .collection("profCandidates");


        pc.onicecandidate=event=>{

            if(event.candidate){

                profCandidatesRef.add(
                    event.candidate.toJSON()
                );

            }

        };


        /*
        ETAT CONNEXION
        */

        pc.onconnectionstatechange=()=>{

            console.log(
                "CONNECTION",
                studentId,
                pc.connectionState
            );


            if(
                pc.connectionState==="connected"
            ){

                console.log(
                    "✅ ETUDIANT CONNECTE:",
                    studentId
                );

            }


            if(
                pc.connectionState==="failed"
            ){

                console.warn(
                    "❌ Connexion échouée:",
                    studentId
                );

            }


            if(
                pc.connectionState==="closed"
            ){

                connections.delete(studentId);

            }

        };


        /*
        IMPORTANT :
        APPLIQUER L'OFFRE
        */

        await pc.setRemoteDescription(
            new RTCSessionDescription({
                type:offerData.type,
                sdp:offerData.sdp
            })
        );


        /*
        RECEVOIR LES ICE DE L'ÉTUDIANT
        */

        const studentCandidatesRef=
            db.collection("salles")
            .doc(roomId)
            .collection("studentCandidates")
            .doc(studentId)
            .collection("candidates");


        const pendingCandidates=[];


        const candidateUnsubscribe=
            studentCandidatesRef.onSnapshot(
                async snapshot=>{

                    for(
                        const change
                        of snapshot.docChanges()
                    ){

                        if(change.type!=="added"){
                            continue;
                        }

                        const candidate=
                            change.doc.data();


                        try{

                            if(
                                pc.remoteDescription
                            ){

                                await pc.addIceCandidate(
                                    new RTCIceCandidate(
                                        candidate
                                    )
                                );

                            }else{

                                pendingCandidates.push(
                                    candidate
                                );

                            }

                        }catch(error){

                            console.warn(
                                "ICE erreur:",
                                error
                            );

                        }

                    }

                }
            );


        candidateListeners.set(
            studentId,
            candidateUnsubscribe
        );


        /*
        REPONSE SDP
        */

        const answer=
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        await db.collection("salles")
            .doc(roomId)
            .collection("answers")
            .doc(studentId)
            .set({

                type:answer.type,
                sdp:answer.sdp,
                createdAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            });


        /*
        APPLIQUER LES CANDIDATS
        QUI ÉTAIENT ARRIVÉS TROP TÔT
        */

        for(
            const candidate
            of pendingCandidates
        ){

            try{

                await pc.addIceCandidate(
                    new RTCIceCandidate(candidate)
                );

            }catch(error){

                console.warn(
                    "ICE pending:",
                    error
                );

            }

        }


        console.log(
            "✅ ANSWER ENVOYÉ:",
            studentId
        );


    }catch(error){

        console.error(
            "ERREUR WEBRTC:",
            studentId,
            error
        );

        connections.delete(studentId);

    }

}


/* =========================
   RENDER STUDENTS
========================= */

function renderStudents(
    viewers,
    pending,
    approved
){

    let html="";


    const pendingIds=
        Object.keys(pending);


    if(pendingIds.length){

        html+=`
        <h4 style="color:#f59e0b;margin:15px 0">
            ⏳ Demandes en attente
        </h4>
        `;


        pendingIds.forEach(id=>{

            const student=pending[id];


            html+=`

            <div class="student">

                <div>

                    <div class="student-name">
                        ${escapeHtml(
                            student.name ||
                            "Étudiant"
                        )}
                    </div>

                    <div class="student-email">
                        ${escapeHtml(
                            student.email || ""
                        )}
                    </div>

                </div>

                <div class="actions">

                    <button
                        class="accept"
                        onclick="approveStudent('${id}')">
                        ✅ Accepter
                    </button>

                    <button
                        class="reject"
                        onclick="rejectStudent('${id}')">
                        ❌ Refuser
                    </button>

                </div>

            </div>

            `;

        });

    }


    const approvedIds=
        Object.keys(viewers)
        .filter(id=>approved.includes(id));


    if(approvedIds.length){

        html+=`
        <h4 style="color:#4ade80;margin:15px 0">
            🟢 Étudiants connectés
        </h4>
        `;


        approvedIds.forEach(id=>{

            const student=viewers[id];

            html+=`

            <div class="student">

                <div>
                    <div class="student-name">
                        ${escapeHtml(
                            student.name ||
                            "Étudiant"
                        )}
                    </div>

                    <div class="student-email">
                        ${escapeHtml(
                            student.email || ""
                        )}
                    </div>
                </div>

                <span style="color:#4ade80">
                    🟢 Direct
                </span>

            </div>

            `;

        });

    }


    if(!html){

        html=`
        <p style="color:#64748b;margin-top:15px">
            Aucun étudiant.
        </p>
        `;

    }


    studentList.innerHTML=html;

}


/* =========================
   APPROUVER
========================= */

async function approveStudent(studentId){

    if(!roomId){
        return;
    }


    try{

        await db.collection("salles")
        .doc(roomId)
        .update({

            approved:
                firebase.firestore.FieldValue
                .arrayUnion(studentId),

            [`pending.${studentId}`]:
                firebase.firestore.FieldValue.delete()

        });


        setStatus(
            "✅ Étudiant accepté.",
            "success"
        );


    }catch(error){

        console.error(error);

        setStatus(
            "❌ Impossible d'accepter.",
            "error"
        );

    }

}


/* =========================
   REFUSER
========================= */

async function rejectStudent(studentId){

    if(!roomId){
        return;
    }


    try{

        await db.collection("salles")
        .doc(roomId)
        .update({

            [`pending.${studentId}`]:
                firebase.firestore.FieldValue.delete()

        });


    }catch(error){

        console.error(error);

    }

}


window.approveStudent=approveStudent;
window.rejectStudent=rejectStudent;


/* =========================
   STOP
========================= */

async function stopLive(){

    if(offersListener){
        offersListener();
        offersListener=null;
    }


    if(roomListener){
        roomListener();
        roomListener=null;
    }


    for(
        const [studentId,pc]
        of connections
    ){

        try{
            pc.close();
        }catch(e){}


        const listener=
            candidateListeners.get(
                studentId
            );

        if(listener){
            listener();
        }

    }


    connections.clear();
    candidateListeners.clear();


    if(roomId){

        try{

            await db.collection("salles")
            .doc(roomId)
            .delete();

        }catch(error){

            console.warn(error);

        }

    }


    roomId=null;


    liveBadge.textContent=
        "🔴 Direct arrêté";

    liveBadge.className=
        "badge offline";


    startBtn.disabled=false;
    stopBtn.disabled=true;


    roomDisplay.textContent="—";


    setStatus(
        "⏹️ Direct arrêté."
    );

}


/* =========================
   CAMERA / MICRO
========================= */

cameraBtn.onclick=()=>{

    if(!localStream)return;

    const track=
        localStream.getVideoTracks()[0];

    if(!track)return;

    track.enabled=!track.enabled;

    cameraBtn.textContent=
        track.enabled
        ? "📷 Caméra"
        : "📷 Caméra OFF";

};


micBtn.onclick=()=>{

    if(!localStream)return;

    const track=
        localStream.getAudioTracks()[0];

    if(!track)return;

    track.enabled=!track.enabled;

    micBtn.textContent=
        track.enabled
        ? "🎤 Micro"
        : "🔇 Micro OFF";

};


/* =========================
   BUTTONS
========================= */

startBtn.onclick=async()=>{

    try{

        startBtn.disabled=true;

        setStatus(
            "🎬 Démarrage de la caméra...",
            ""
        );

        await startLive();

    }catch(error){

        console.error(error);

        setStatus(
            "❌ "+error.message,
            "error"
        );

        startBtn.disabled=false;

    }

};


stopBtn.onclick=async()=>{

    stopBtn.disabled=true;

    await stopLive();

};


document
.getElementById("copyBtn")
.onclick=async()=>{

    if(!roomId)return;

    try{

        await navigator.clipboard.writeText(
            roomId
        );

        setStatus(
            "📋 ID copié.",
            "success"
        );

    }catch(e){}

};


/* =========================
   LOGIN
========================= */

loginBtn.onclick=async()=>{

    try{

        loginBtn.disabled=true;

        const provider=
            new firebase.auth.GoogleAuthProvider();

        await auth.signInWithPopup(
            provider
        );

    }catch(error){

        loginError.textContent=
            "❌ "+error.message;

        loginBtn.disabled=false;

    }

};


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(user=>{

    if(user){

        loginPanel.style.display="none";
        app.style.display="block";

    }else{

        loginPanel.style.display="block";
        app.style.display="none";

    }

});


/* =========================
   CLEANUP
========================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(localStream){

            localStream
            .getTracks()
            .forEach(track=>track.stop());

        }

    }
);


/* =========================
   SECURITY HTML
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
